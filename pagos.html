<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pagos | Sistema Web de Matrícula</title>

    <link rel="stylesheet" href="css/pagos.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">


</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">

            <img src="assets/img/logo.png" alt="Logo">

            <h2>IESTP Recuay</h2>

        </div>

        <!-- Botón menú hamburguesa -->
        <button class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
        </button>

        <nav class="menu" id="menu">

            <ul>

                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="matricula.html">Matrícula</a></li>
                <li><a href="cursos.html">Cursos</a></li>
                <li><a href="pagos.html" class="activo">Pagos</a></li>
                <li><a href="reportes.html">Reportes</a></li>
                <li><a href="login.html">Cerrar Sesión</a></li>

            </ul>

        </nav>

    </header>

    <!-- CONTENIDO -->

    <main class="contenedor">

        <h1>Registro de Pagos</h1>

        <form id="frmPagos">

            <div class="grupo">

                <label>DNI del Estudiante</label>

                <input
                type="text"
                id="dni"
                maxlength="8"
                placeholder="Ingrese DNI"
                required>

            </div>

            <div class="grupo">

                <label>Nombre del Estudiante</label>

                <input
                type="text"
                id="nombre"
                placeholder="Ingrese nombre"
                required>

            </div>

            <div class="grupo">

                <label>carrera</label>

                <select id="destino" required>

                    <option value="">Seleccione</option>

                    <option value="50">arquitectura(S/50)</option>
                    <option value="80">topografia(S/80)</option>
                    <option value="100">enfermeria(S/80)</option>
                  
                </select>

            </div>

            <div class="grupo">

                <label>Precio Base</label>

                <input
                type="number"
                id="precioBase"
                readonly>

            </div>

            <div class="grupo">

                <label>Subtotal</label>

                <input
                type="number"
                id="subtotal"
                readonly>

            </div>

            <div class="grupo">

                <label>IGV (18%)</label>

                <input
                type="number"
                id="igv"
                readonly>

            </div>

            <div class="grupo">

                <label>Total</label>

                <input
                type="number"
                id="total"
                readonly>

            </div>

            <div class="botones">

                <button type="submit">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Registrar Pago

                </button>

                <button type="reset">

                    <i class="fa-solid fa-eraser"></i>

                    Limpiar

                </button>

            </div>

        </form>

        <h2>Historial de Pagos</h2>

        <table>

            <thead>

                <tr>

                    <th>DNI</th>
                    <th>Nombre</th>
                    <th>Destino</th>
                    <th>Precio Base</th>
                    <th>Subtotal</th>
                    <th>IGV</th>
                    <th>Total</th>
                    <th>Acciones</th>

                </tr>

            </thead>

            <tbody id="tablaPagos">

                <tr>

                    <td colspan="8">

                        No existen pagos registrados.

                    </td>

                </tr>

            </tbody>

        </table>

    </main>

    <!-- FOOTER -->

    <footer>

        <p>

            © 2026 Sistema Web de Matrícula - IESTP Recuay

        </p>
        <p>palacios rosales jimmy </p>

    </footer>

    <script src="js/app.js"></script>
    <script src="js/pagos.js"></script>

</body>

</html>
