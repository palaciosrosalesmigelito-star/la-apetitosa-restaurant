<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes | Sistema Web de Matricula</title>
    <link rel="stylesheet" href="css/reportes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
</head>

<body>
    <header class="header">
        <div class="logo">
            <img src="assets/img/logo.png" alt="Logo">
            <h2>IESTP Recuay</h2>
        </div>

        <button class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
        </button>

        <nav class="menu" id="menu">
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="matricula.html">Matricula</a></li>
                <li><a href="cursos.html">Cursos</a></li>
                <li><a href="pagos.html">Pagos</a></li>
                <li><a href="reportes.html" class="activo">Reportes</a></li>
                <li><a href="login.html">Cerrar Sesion</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor">
        <h1>Reportes del Sistema</h1>

        <div class="buscador">
            <input type="text" id="buscar" placeholder="Buscar estudiante, curso o pago...">
            <button id="btnBuscar" type="button">
                <i class="fa-solid fa-magnifying-glass"></i>
                Buscar
            </button>
        </div>

        <div class="acciones-reportes">
            <button id="btnPDF" type="button">
                <i class="fa-solid fa-file-pdf"></i>
                Descargar PDF
            </button>

            <button id="btnExcel" type="button">
                <i class="fa-solid fa-file-excel"></i>
                Descargar Excel
            </button>

            <button id="btnImprimir" type="button">
                <i class="fa-solid fa-print"></i>
                Imprimir
            </button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Modulo</th>
                    <th>Tipo</th>
                    <th>Codigo / DNI</th>
                    <th>Nombre</th>
                    <th>Descripcion</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaReportes">
                <tr>
                    <td colspan="7">No existen registros.</td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer>
        <p>© 2026 Sistema Web de Matricula - IESTP Recuay</p>
        <p>palacios rosales jimmy</p>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/reportes.js"></script>
</body>

</html>
